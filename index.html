<style>
:root {
  --bg: #F7F5F2;
  --accent: #E2552B;
  --ink: #1A1A1A;
  --muted: #6B6560;
  --card: #FFFFFF;
  --line: #E3DDD6;
  --bar-h: 92px;
  --font: -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.wrap { max-width: 560px; margin: 0 auto; padding: 40px 24px calc(var(--bar-h) + 32px + env(safe-area-inset-bottom, 0px)); }
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
section { margin-top: 48px; }

.brand { margin: 0 0 16px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0 0 16px; font-size: clamp(34px, 10.5vw, 48px); line-height: 1.05; font-weight: 800; letter-spacing: -.02em; }
.role { margin: 0 0 24px; padding: 0; list-style: none; display: grid; gap: 4px; color: var(--muted); }
.role li { max-width: 46ch; }

.box { padding: 24px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
.box > :first-child { margin-top: 0; }
.bio { margin: 0; }
.note { margin: 12px 0 0; padding: 10px 16px; font-size: 13px; color: var(--muted); border: 1px dashed var(--accent); border-radius: 12px; }

.tag { margin: 0 0 12px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.box h2 { margin: 0 0 12px; font-size: 24px; line-height: 1.2; font-weight: 800; letter-spacing: -.01em; }
.box p.txt-p { margin: 0 0 24px; color: var(--muted); }
.sec-title { margin: 0 0 16px; font-size: 22px; line-height: 1.2; font-weight: 800; letter-spacing: -.01em; }

.btn { display: block; padding: 18px 24px; text-align: center; font-size: 17px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 16px; }
.btn:active { opacity: .85; }

.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.card { display: flex; align-items: center; gap: 16px; padding: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
.card:active { border-color: var(--accent); }
.num { flex: none; min-width: 2ch; font-size: 18px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.txt { flex: 1; min-width: 0; }
.t { display: block; font-size: 17px; font-weight: 700; line-height: 1.3; }
.n { display: block; margin-top: 4px; font-size: 13px; color: var(--muted); }
.arr { flex: none; width: 22px; height: 22px; color: var(--accent); }

.prod { display: flex; flex-direction: column; gap: 12px; }
.prod h3 { margin: 0; font-size: 20px; line-height: 1.25; font-weight: 800; }
.prod p { margin: 0; color: var(--muted); }
.price { font-size: 22px; font-weight: 800; }
.prod .btn { margin-top: 8px; }

.offer { background: var(--ink); border-color: var(--ink); color: #fff; }
.offer h2 { font-size: 28px; }
.offer p.txt-p { color: #CFC9C3; }

footer { margin-top: 48px; text-align: center; font-size: 13px; color: var(--muted); }

.avatar { display: block; width: 88px; height: 88px; margin: 0 0 20px; border-radius: 50%; object-fit: cover; border: 1px solid var(--line); }
.shot { display: block; margin: 0 0 20px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.shot img { display: block; width: 100%; height: auto; }
.shot-solo { margin: 0; }
.sec-text { margin: -8px 0 16px; font-size: 14px; color: var(--muted); }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bg); border-top: 1px solid var(--line); padding: 12px 24px calc(12px + env(safe-area-inset-bottom, 0px)); }
.bar .btn { max-width: 512px; margin: 0 auto; }
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<script>
(function () {
  "use strict";
  var D = window.KK_DATA;
  var BG = "#F7F5F2";
  var SVG_NS = "http://www.w3.org/2000/svg";

  /* ---------- внутри Телеграма или нет ---------- */
  function insideTelegram() {
    var h = String(location.hash || ""), s = String(location.search || "");
    if (h.indexOf("tgWebApp") !== -1 || s.indexOf("tgWebApp") !== -1) return true;
    if (window.TelegramWebviewProxy) return true;
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.performAction) return true;
    } catch (e) {}
    return false;
  }
  var IN_TG = insideTelegram();
  var tg = (window.Telegram && window.Telegram.WebApp) || null;

  /* ---------- события напрямую, если нет Telegram.WebApp ---------- */
  function postEvent(name, data) {
    var payload = data || {};
    try {
      if (window.TelegramWebviewProxy && window.TelegramWebviewProxy.postEvent) {
        window.TelegramWebviewProxy.postEvent(name, JSON.stringify(payload));
        return;
      }
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.performAction) {
        window.webkit.messageHandlers.performAction.postMessage({ eventType: name, eventData: payload });
        return;
      }
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(JSON.stringify({ eventType: name, eventData: payload }), "*");
      }
    } catch (e) {}
  }

  /* ---------- построение разметки из KK_DATA ---------- */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function link(cls, url) {
    var a = el("a", cls);
    a.href = url;
    a.setAttribute("data-url", url);
    a.target = IN_TG ? "_self" : "_blank";
    if (!IN_TG) a.rel = "noopener noreferrer";
    return a;
  }
  function arrow() {
    var svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("class", "arr");
    svg.setAttribute("aria-hidden", "true");
    var p = document.createElementNS(SVG_NS, "path");
    p.setAttribute("d", "M9 5l7 7-7 7");
    p.setAttribute("fill", "none");
    p.setAttribute("stroke", "currentColor");
    p.setAttribute("stroke-width", "2.5");
    p.setAttribute("stroke-linecap", "round");
    p.setAttribute("stroke-linejoin", "round");
    svg.appendChild(p);
    return svg;
  }
  function button(b) {
    var a = link("btn", b.url);
    a.textContent = b.label;
    return a;
  }

  var IMG = window.KK_IMAGES || {};
  var app = document.getElementById("app");
  document.title = D.name;

  /* 1. шапка и пометка о примере */
  var header = el("header");
  if (IMG.photo) {
    var av = el("img", "avatar");
    av.src = IMG.photo;
    av.alt = D.photoAlt;
    header.appendChild(av);
  }
  header.appendChild(el("p", "brand", D.brand));
  header.appendChild(el("h1", null, D.name));
  var role = el("ul", "role");
  D.role.forEach(function (r) { role.appendChild(el("li", null, r)); });
  header.appendChild(role);
  var bio = el("div", "box");
  bio.appendChild(el("p", "bio", D.bio));
  header.appendChild(bio);
  header.appendChild(el("p", "note", D.demoNote));
  app.appendChild(header);

  /* 2. лид-магнит */
  var lead = el("section");
  lead.appendChild(el("p", "tag", D.lead.tag));
  var lb = el("div", "box");
  if (IMG.lead) {
    var shot = link("shot", D.lead.button.url);
    var im = el("img");
    im.src = IMG.lead;
    im.alt = D.lead.imageAlt;
    shot.appendChild(im);
    lb.appendChild(shot);
  }
  lb.appendChild(el("p", "txt-p", D.lead.text));
  lb.appendChild(button(D.lead.button));
  lead.appendChild(lb);
  app.appendChild(lead);

  /* 3. посты */
  var posts = el("section");
  posts.appendChild(el("p", "tag", D.posts.tag));
  posts.appendChild(el("h2", "sec-title", D.posts.title));
  posts.appendChild(el("p", "sec-text", D.posts.text));
  var pl = el("ul", "list");
  D.posts.items.forEach(function (p, i) {
    var li = el("li");
    var a = link("card", p.url);
    a.appendChild(el("span", "num", String(i + 1)));
    var t = el("span", "txt");
    t.appendChild(el("span", "t", p.title));
    if (p.note) t.appendChild(el("span", "n", p.note));
    a.appendChild(t);
    a.appendChild(arrow());
    li.appendChild(a);
    pl.appendChild(li);
  });
  posts.appendChild(pl);
  app.appendChild(posts);

  /* 4. продукты */
  var prods = el("section");
  prods.appendChild(el("p", "tag", D.products.tag));
  prods.appendChild(el("h2", "sec-title", D.products.title));
  prods.appendChild(el("p", "sec-text", D.products.text));
  if (IMG.tripwire) {
    var tw = link("shot shot-solo", D.products.url);
    var twi = el("img");
    twi.src = IMG.tripwire;
    twi.alt = D.products.imageAlt;
    tw.appendChild(twi);
    prods.appendChild(tw);
  }
  app.appendChild(prods);

  /* 5. кейсы */
  var cases = el("section");
  cases.appendChild(el("p", "tag", D.cases.tag));
  var cb = el("div", "box");
  cb.appendChild(el("h2", null, D.cases.title));
  cb.appendChild(el("p", "txt-p", D.cases.note));
  if (IMG.graduates) {
    var gr = link("shot", D.cases.button.url);
    var gri = el("img");
    gri.src = IMG.graduates;
    gri.alt = D.cases.imageAlt;
    gr.appendChild(gri);
    cb.appendChild(gr);
  }
  cb.appendChild(button(D.cases.button));
  cases.appendChild(cb);
  app.appendChild(cases);

  /* 6. финальное предложение */
  var offer = el("section");
  offer.appendChild(el("p", "tag", D.offer.tag));
  var ob = el("div", "box offer");
  ob.appendChild(el("h2", null, D.offer.title));
  ob.appendChild(el("p", "txt-p", D.offer.text));
  ob.appendChild(button(D.offer.button));
  offer.appendChild(ob);
  app.appendChild(offer);

  /* 7. подвал */
  app.appendChild(el("footer", null, D.footer));

  /* 8. закреплённая полоса */
  var bar = el("div", "bar");
  bar.appendChild(button(D.bar));
  document.body.appendChild(bar);

  /* ---------- запуск внутри Телеграма ---------- */
  if (tg) {
    try {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor(BG);
      if (tg.setBackgroundColor) tg.setBackgroundColor(BG);
      if (tg.setBottomBarColor) tg.setBottomBarColor(BG);
    } catch (e) {}
  } else if (IN_TG) {
    postEvent("web_app_ready");
    postEvent("web_app_expand");
    postEvent("web_app_set_header_color", { color: BG });
    postEvent("web_app_set_background_color", { color: BG });
  }

  /* ---------- клик по ссылке ---------- */
  function onLinkClick(ev) {
    if (!IN_TG) return; /* обычный браузер: ссылка открывается сама */
    var url = this.getAttribute("data-url");
    if (!url) return;
    ev.preventDefault();
    var isTme = url.indexOf("https://t.me/") === 0;

    if (tg) {
      if (isTme) {
        /* порядок важен: сначала close, сразу после него openTelegramLink */
        tg.close();
        tg.openTelegramLink(url);
      } else {
        tg.openLink(url);
      }
      return;
    }

    if (isTme) {
      postEvent("web_app_close");
      postEvent("web_app_open_tg_link", { path_full: url.replace("https://t.me", "") });
    } else {
      postEvent("web_app_open_link", { url: url });
    }
  }
  var links = document.querySelectorAll("a[data-url]");
  for (var k = 0; k < links.length; k++) links[k].addEventListener("click", onLinkClick);
})();
</script>
</body>
</html>
