<style>
:root {
  --bg: #F7F5F2;
  --accent: #E2552B;
  --ink: #1A1A1A;
  --muted: #6B6560;
  --card: #FFFFFF;
  --line: #E3DDD6;
  --bar-h: 92px;
  --mx: radial-gradient(90% 70% at 100% 0%, rgba(92, 132, 255, .42) 0%, transparent 60%), radial-gradient(70% 60% at 0% 100%, rgba(130, 80, 255, .30) 0%, transparent 60%), linear-gradient(rgba(130, 170, 255, .06) 1px, transparent 1px) 0 0 / 26px 26px, linear-gradient(90deg, rgba(130, 170, 255, .06) 1px, transparent 1px) 0 0 / 26px 26px, linear-gradient(155deg, #050B2E 0%, #0A1A5C 50%, #13309F 100%);
  --font: -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); font-family: var(--font); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.wrap { max-width: 560px; margin: 0 auto; padding: 40px 24px calc(var(--bar-h) + 32px + env(safe-area-inset-bottom, 0px)); }
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
section { margin-top: 48px; }

.brand { margin: 0 0 16px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0 0 16px; font-size: clamp(34px, 10.5vw, 48px); line-height: 1.05; font-weight: 700; letter-spacing: -.02em; }
.role { margin: 0 0 24px; padding: 0; list-style: none; display: grid; gap: 4px; color: var(--muted); }
.role li { max-width: 46ch; }
.help { margin: 0 0 24px; }
.help-title { margin: 0 0 12px; font-weight: 700; color: var(--ink); }
.help-row { display: flex; gap: 10px; color: var(--ink); }
.help-row + .help-row { margin-top: 10px; }
.help-dot { flex: none; font-weight: 700; color: var(--accent); }

.box { padding: 24px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
.box > :first-child { margin-top: 0; }
.bio { margin: 0; }
.bio + .bio { margin-top: 12px; }
.note { margin: 12px 0 0; padding: 28px 24px; background: var(--mx); color: #fff; border: 1px solid rgba(110, 150, 255, .4); border-radius: 16px; font-size: 22px; line-height: 1.3; font-weight: 700; letter-spacing: -.01em; }
.hl { color: var(--accent); }
.note .hl { color: #FF8C42; }
.nw { white-space: nowrap; }
.hi { margin: 0 0 16px; padding: 2px 0 2px 16px; border-left: 3px solid var(--accent); font-size: 17px; font-weight: 700; line-height: 1.45; color: var(--ink); }

.tag { margin: 0 0 12px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.box h2 { margin: 0 0 12px; font-size: 24px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; }
.box p.txt-p { margin: 0 0 16px; color: var(--muted); }
.sec-title { margin: 0 0 16px; font-size: 22px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; }

.btn { display: block; padding: 18px 24px; text-align: center; font-size: 17px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 16px; }
.btn:active { opacity: .85; }

.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.card { display: flex; align-items: center; gap: 16px; padding: 20px; background: var(--card); border: 1px solid var(--accent); border-radius: 16px; }
.card:active { background: #FFEFE8; }
.num { flex: none; min-width: 2ch; font-size: 18px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.txt { flex: 1; min-width: 0; }
.t { display: block; font-size: 17px; font-weight: 700; line-height: 1.3; }
.n { display: block; margin-top: 4px; font-size: 13px; color: var(--muted); }
.arr { flex: none; width: 22px; height: 22px; color: var(--accent); }



footer { margin-top: 48px; text-align: center; font-size: 13px; color: var(--muted); }

.avatar { display: block; width: 88px; height: 88px; margin: 0 0 20px; border-radius: 50%; object-fit: cover; border: 1px solid var(--line); }
.shot { display: block; margin: 0 0 20px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.shot img { display: block; width: 100%; height: auto; }
.debug { position: fixed; top: 0; left: 0; right: 0; z-index: 20; margin: 0; padding: 8px 12px; background: #000; color: #7CFF7C; font: 11px/1.4 monospace; white-space: pre-wrap; }
.point { display: inline-block; animation: nudge 1.4s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: translateY(-2px); } 50% { transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .point { animation: none; } }
.premium { padding: 40px 28px; background: var(--ink); border-color: var(--ink); color: #F7F5F2; outline: 1px solid rgba(226, 85, 43, .55); outline-offset: -10px; }
.premium h2 { margin: 0 0 24px; font-size: 30px; font-weight: 700; line-height: 1.15; letter-spacing: -.01em; color: #F7F5F2; }
.premium h2::before { content: ""; display: block; width: 44px; height: 2px; margin-bottom: 22px; background: var(--accent); }
.premium h2 .l2 { display: block; color: var(--accent); }
.premium .hi { color: #FFFFFF; }
.premium p.txt-p { color: #FFFFFF; font-size: 17px; line-height: 1.55; }
.premium p.txt-p.li { margin: 0 0 10px; }
.premium p.txt-p.li-head { margin-bottom: 12px; font-weight: 700; }
.premium .btn { margin-top: 12px; }
.premium .shot { border-color: rgba(247, 245, 242, .2); }
.sec-text { margin: -8px 0 16px; font-size: 14px; color: var(--muted); }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bg); border-top: 1px solid var(--line); padding: 12px 24px calc(12px + env(safe-area-inset-bottom, 0px)); }
.bar .btn { max-width: 512px; margin: 0 auto; }
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<script>
(function () {
  "use strict";
  var D = window.KK_DATA;
  var BG = "#F7F5F2";
  var SVG_NS = "http://www.w3.org/2000/svg";

  /* ---------- внутри MAX или нет ---------- */
  /* скрипт max-web-app.js грузится и в обычном браузере, но поля объекта WebApp там пустые */
  var wa = window.WebApp || null;
  function insideMax() {
    try {
      if (!wa) return false;
      if (wa.initData || wa.platform || wa.version) return true;
      if (wa.initDataUnsafe && wa.initDataUnsafe.user) return true;
    } catch (e) {}
    return false;
  }
  var IN_MAX = insideMax();

  /* ---------- разбор ссылок: любая запись max.ru приводится к одному виду ---------- */
  /* принимает https://max.ru/x, http://max.ru/x, max.ru/x; результат всегда начинается с https://max.ru/ */
  function maxPath(u) {
    var m = /^(?:https?:\/\/)?(?:www\.)?max\.ru(\/.*)?$/i.exec(String(u || "").trim());
    return m && m[1] && m[1].length > 1 ? m[1] : null;
  }
  function normalizeUrl(u) {
    var path = maxPath(u);
    if (path) return "https://max.ru" + path;
    u = String(u || "").trim();
    if (/^[a-z][a-z0-9+.\-]*:/i.test(u)) {
      try { return new URL(u).href; } catch (e) { return u; }
    }
    return "https://" + u;
  }

  /* режим отладки: добавьте ?debug=1 к адресу приложения, и вверху появится строка с диагнозом */
  var DEBUG = /(?:^|[?&])debug(?:=|&|$)/.test(String(location.search || ""));
  function debug(text) {
    if (!DEBUG) return;
    var d = document.getElementById("kk-debug");
    if (!d) { d = document.createElement("pre"); d.id = "kk-debug"; d.className = "debug"; document.body.appendChild(d); }
    d.textContent = text;
  }

  /* ---------- построение разметки из KK_DATA ---------- */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  /* *текст* в данных выделяется акцентным цветом */
  function addText(parent, text) {
    /* диапазон вроде 300-500К+ не переносится по дефису */
    text.split(/(\d+[-–]\d+К\+)/).forEach(function (t, i) {
      if (!t) return;
      if (i % 2) parent.appendChild(el("span", "nw", t));
      else parent.appendChild(document.createTextNode(t));
    });
  }
  function rich(parent, text) {
    String(text || "").split("*").forEach(function (part, i) {
      if (!part) return;
      if (i % 2) { var h = el("span", "hl"); addText(h, part); parent.appendChild(h); }
      else addText(parent, part);
    });
  }
  function paras(parent, text) {
    String(text || "").split("\n\n").forEach(function (t) {
      if (!t) return;
      var lines = t.split("\n");
      if (lines.length === 1) { parent.appendChild(el("p", "txt-p", t)); return; }
      lines.forEach(function (line) {
        parent.appendChild(el("p", /:$/.test(line) ? "txt-p li li-head" : "txt-p li", line));
      });
    });
  }
  function link(cls, url) {
    var a = el("a", cls);
    url = normalizeUrl(url);
    a.href = url;
    a.setAttribute("data-url", url);
    a.target = IN_MAX ? "_self" : "_blank";
    if (!IN_MAX) a.rel = "noopener noreferrer";
    return a;
  }
  function arrow() {
    var svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("class", "arr");
    svg.setAttribute("aria-hidden", "true");
    var p = document.createElementNS(SVG_NS, "path");
    p.setAttribute("d", "M9 5l7 7-7 7");
    p.setAttribute("fill", "none");
    p.setAttribute("stroke", "currentColor");
    p.setAttribute("stroke-width", "2.5");
    p.setAttribute("stroke-linecap", "round");
    p.setAttribute("stroke-linejoin", "round");
    svg.appendChild(p);
    return svg;
  }
  function button(b) {
    var a = link("btn", b.url);
    a.textContent = b.label;
    return a;
  }

  var IMG = window.KK_IMAGES || {};
  var app = document.getElementById("app");
  document.title = D.name;

  /* 1. шапка */
  var header = el("header");
  if (IMG.photo) {
    var av = el("img", "avatar");
    av.src = IMG.photo;
    av.alt = D.photoAlt;
    header.appendChild(av);
  }
  if (D.brand) header.appendChild(el("p", "brand", D.brand));
  header.appendChild(el("h1", null, D.name));
  var role = el("ul", "role");
  D.role.forEach(function (r) { role.appendChild(el("li", null, r)); });
  header.appendChild(role);
  if (D.help) {
    var hb = el("div", "help");
    D.help.split("\n").forEach(function (line, i) {
      if (i === 0) { hb.appendChild(el("p", "help-title", line)); return; }
      var row = el("div", "help-row");
      row.appendChild(el("span", "help-dot", "•"));
      var tx = el("span");
      addText(tx, line.replace(/^•\s*/, ""));
      row.appendChild(tx);
      hb.appendChild(row);
    });
    header.appendChild(hb);
  }
  var bio = el("div", "box");
  D.bio.split("\n\n").forEach(function (t) { bio.appendChild(el("p", "bio", t)); });
  header.appendChild(bio);
  var note = el("p", "note");
  rich(note, D.demoNote);
  header.appendChild(note);
  app.appendChild(header);

  /* 2. лид-магнит */
  var lead = el("section");
  if (D.lead.tag) lead.appendChild(el("p", "tag", D.lead.tag));
  var lb = el("div", "box");
  if (IMG.lead) {
    var shot = link("shot", D.lead.button.url);
    var im = el("img");
    im.src = IMG.lead;
    im.alt = D.lead.imageAlt;
    shot.appendChild(im);
    lb.appendChild(shot);
  }
  paras(lb, D.lead.text);
  if (D.lead.accent) {
    var hp = el("p", "hi");
    rich(hp, D.lead.accent);
    lb.appendChild(hp);
  }
  lb.appendChild(button(D.lead.button));
  lead.appendChild(lb);

  /* 3. посты */
  var posts = el("section");
  if (D.posts.tag) posts.appendChild(el("p", "tag", D.posts.tag));
  var pt = el("h2", "sec-title", D.posts.title);
  if (D.posts.pointer) {
    pt.appendChild(document.createTextNode(" "));
    pt.appendChild(el("span", "point", D.posts.pointer));
  }
  posts.appendChild(pt);
  if (D.posts.text) posts.appendChild(el("p", "sec-text", D.posts.text));
  var pl = el("ul", "list");
  D.posts.items.forEach(function (p, i) {
    var li = el("li");
    var a = link("card", p.url);
    a.appendChild(el("span", "num", String(i + 1)));
    var t = el("span", "txt");
    t.appendChild(el("span", "t", p.title));
    if (p.note) t.appendChild(el("span", "n", p.note));
    a.appendChild(t);
    a.appendChild(arrow());
    li.appendChild(a);
    pl.appendChild(li);
  });
  posts.appendChild(pl);
  app.appendChild(posts);
  app.appendChild(lead);

  /* 4. личное сопровождение */
  var cases = el("section");
  if (D.cases.tag) cases.appendChild(el("p", "tag", D.cases.tag));
  var cb = el("div", "box premium");
  var ct = el("h2");
  var cparts = String(D.cases.title).split(" / ");
  if (cparts.length > 1) {
    ct.appendChild(document.createTextNode(cparts[0]));
    ct.appendChild(el("span", "l2", cparts.slice(1).join(" / ")));
  } else {
    ct.textContent = D.cases.title;
  }
  cb.appendChild(ct);
  var ch = el("p", "hi");
  rich(ch, D.cases.text);
  cb.appendChild(ch);
  if (IMG.cases) {
    var gr = el("div", "shot");
    var gri = el("img");
    gri.src = IMG.cases;
    gri.alt = D.cases.imageAlt;
    gr.appendChild(gri);
    cb.appendChild(gr);
  }
  paras(cb, D.cases.between);
  cb.appendChild(button(D.cases.button));
  cases.appendChild(cb);
  app.appendChild(cases);

  /* 7. подвал */
  app.appendChild(el("footer", null, D.footer));

  /* 8. закреплённая полоса */
  var bar = el("div", "bar");
  bar.appendChild(button(D.bar));
  document.body.appendChild(bar);

  /* ---------- запуск внутри MAX ---------- */
  if (IN_MAX) {
    try { if (typeof wa.ready === "function") wa.ready(); } catch (e) {}
  }

  function info() {
    return "внутри MAX: " + IN_MAX + "\nWebApp: " + (wa ? "есть, версия " + wa.version + ", платформа " + wa.platform + ", initData " + (wa.initData ? "заполнен" : "пуст") : "нет (скрипт max-web-app.js не загрузился?)");
  }
  debug(info());

  /* ---------- клик по ссылке ---------- */
  function onLinkClick(ev) {
    if (!IN_MAX) return; /* обычный браузер: ссылка открывается сама */
    var url = this.getAttribute("data-url");
    if (!url) return;
    ev.preventDefault();
    var isMax = url.indexOf("https://max.ru/") === 0;
    debug(info() + "\nclick: " + url + "\nветка: " + (isMax ? "openMaxLink, затем close" : "openLink"));
    try {
      if (isMax) {
        /* порядок: сначала openMaxLink, сразу после него close */
        wa.openMaxLink(url);
        wa.close();
      } else {
        wa.openLink(url);
      }
    } catch (e) {
      debug(info() + "\nошибка: " + e);
    }
  }
  var links = document.querySelectorAll("a[data-url]");
  for (var k = 0; k < links.length; k++) links[k].addEventListener("click", onLinkClick);
})();
</script>
</body>
</html>
